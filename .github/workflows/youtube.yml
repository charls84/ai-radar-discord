name: YouTube Viral -> Discord/Slack

on:
  schedule:
    # 16:30 hora de Miami (America/New_York), lunes a viernes.
    # GitHub usa UTC: 20:30 UTC en horario de verano (EDT) y 21:30 UTC en invierno (EST).
    # El paso "Revisar hora de Miami" deja correr solo la que coincide.
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      ejemplo:
        description: "Solo prueba: republicar 1 video ya archivado (el de mas vistas) con resumen de Gemini"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-youtube
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar hora de Miami
        id: hora
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          # Desfase actual de Nueva York: -0400 (verano) o -0500 (invierno).
          desfase=$(TZ=America/New_York date +%z)
          if [ "$desfase" = "-0400" ]; then esperado="30 20 * * 1-5"; else esperado="30 21 * * 1-5"; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$CRON" != "$esperado" ]; then
            echo "Cron '$CRON' no corresponde a las 16:30 de Miami hoy (desfase $desfase). Se omite."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.hora.outputs.correr == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.hora.outputs.correr == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.hora.outputs.correr == 'true'
        run: pip install -r requirements.txt

      - name: Run YouTube viral
        if: steps.hora.outputs.correr == 'true'
        env:
          WEBHOOK_YOUTUBE_AI: ${{ secrets.WEBHOOK_YOUTUBE_AI }}
          SLACK_WEBHOOK_YOUTUBE_AI: ${{ secrets.SLACK_WEBHOOK_YOUTUBE_AI }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          EJEMPLO: ${{ inputs.ejemplo }}
        run: |
          if [ "$EJEMPLO" = "true" ]; then
            python bot.py --sembrar-youtube --ejemplo
          else
            python bot.py --solo-youtube
          fi

      - name: Commit y push del estado
        if: steps.hora.outputs.correr == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin main
            python merge_estado.py
            cp state.json /tmp/state_merged.json
            git reset --hard origin/main
            cp /tmp/state_merged.json state.json
            git add state.json
            if git diff --staged --quiet; then
              echo "Sin cambios en state.json"
              exit 0
            fi
            git commit -m "chore: update state (youtube) [skip ci]"
            if git push; then
              exit 0
            fi
            echo "Push fallo (probablemente radar.yml commiteo al mismo tiempo), re-fusionando ($i)..."
            sleep 5
          done
          echo "No se pudo commitear el estado tras varios intentos"
          exit 1
